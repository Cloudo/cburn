[project]
name = "cburn"
version = "0.2.0"
description = "A Claude speedometer: a local dashboard of token spend across every Claude Code session"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "watchdog>=6.0",
    "orjson>=3.10",
    "httpx>=0.28",
    "tomli-w>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
]

[project.scripts]
cburn = "cburn.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cburn"]
# The built frontend is ignored by git (the release workflow puts it there), and hatchling
# skips what the vcs ignores - so it has to be named as an artifact, or the wheel ships
# without a dashboard.
artifacts = ["src/cburn/web_dist/**"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
# The smoke test over the real history depends on the machine rather than on the
# repository: it is off by default, run it with `pytest -m real_history` (task B8).
markers = ["real_history: runs over the real ~/.claude/projects"]
addopts = "-m 'not real_history'"

[tool.mypy]
python_version = "3.11"
packages = ["cburn"]
mypy_path = "src"
ignore_missing_imports = true
