[project]
name = "cloudo-dash"
version = "0.1.0"
description = "Спидометр Claude: локальный дашборд расхода токенов по всем сессиям Claude Code"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "watchdog>=6.0",
    "orjson>=3.10",
    "httpx>=0.28",
    "tomli-w>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
]

[project.scripts]
cdash = "cloudo_dash.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudo_dash"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
packages = ["cloudo_dash"]
mypy_path = "src"
ignore_missing_imports = true
