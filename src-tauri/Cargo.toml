[package]
name = "cburn"
version = "0.1.0"
description = "The Claude speedometer: a local dashboard of Claude Code token spend"
authors = ["Nikolay Shevlyakov"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "cburn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# `tray-icon` - the menu-bar icon (task F2).
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
# Polling our own API from the tray: the simplest synchronous client is what is needed,
# an async runtime for one request every five seconds is not.
ureq = { version = "2", features = ["json"] }
tauri-plugin-autostart = "2.5.1"
# One window and one tray per machine: a second launch wakes the first one instead.
tauri-plugin-single-instance = "2.4.3"
