[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# `tray-icon` — иконка в меню-баре (задача F2).
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
# Опрос своего же API из трея: нужен самый простой синхронный клиент,
# асинхронный рантайм ради одного запроса раз в пять секунд не нужен.
ureq = { version = "2", features = ["json"] }
tauri-plugin-autostart = "2.5.1"
