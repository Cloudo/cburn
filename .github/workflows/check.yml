# The three checks that must pass before a commit, plus the frontend build - the same
# ones `make check` and `make web` run by hand. macOS is the target and the only platform
# the paths, the keychain and the tray are written for, so the runner is macOS too.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # 3.11 is the floor declared in pyproject: what passes here passes above it.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: tests
        run: .venv/bin/python -m pytest -q

      - name: lint and format
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: types
        run: .venv/bin/mypy

      - name: frontend
        run: |
          cd web
          npm ci
          npm run build
